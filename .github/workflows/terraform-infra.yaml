name: Terraform Multi-Environment Pipeline

on:
  #pull_request:
  #  branches:
  #    - main
  #  paths:
  #    - '**.tf'
  #    - 'envs/**.tfvars'
  #push:
  #  branches:
  #    - main
  #  paths:
  #    - '**.tf'
   #   - 'envs/**.tfvars'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read
  pull-requests: write # Required for posting plan summaries on PRs

jobs:
  # ==========================================================
  # 1. Speculative Check on Pull Requests
  # ==========================================================
  terraform-pr-check:
    name: Terraform PR Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, uat, prod]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=tk/tf-coaching17-infra-${{ matrix.environment }}.tfstate" \
            -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="envs/${{ matrix.environment }}.tfvars" \
            -no-color

  # ==========================================================
  # 2. Automated Apply or Manual Execution
  # ==========================================================
  terraform-deploy:
    name: Terraform Run
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # When triggered by push, default to dev; when manual, use the chosen environment
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve Environment & Action
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "action=apply" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=tk/tf-coaching17-infra-${{ steps.params.outputs.env }}.tfstate" \
            -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: steps.params.outputs.action == 'plan'
        run: |
          terraform plan \
            -var-file="envs/${{ steps.params.outputs.env }}.tfvars"

      - name: Terraform Apply
        if: steps.params.outputs.action == 'apply'
        run: |
          terraform apply \
            -var-file="envs/${{ steps.params.outputs.env }}.tfvars" \
            -auto-approve

      - name: Terraform Destroy
        if: steps.params.outputs.action == 'destroy'
        run: |
          terraform destroy \
            -var-file="envs/${{ steps.params.outputs.env }}.tfvars" \
            -auto-approve