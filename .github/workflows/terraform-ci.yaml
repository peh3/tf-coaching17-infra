name: Terraform CI (Manual)
# Adds the environment directly to the run dashboard title
run-name: "Plan [${{ inputs.environment }}] by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to plan'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

        # --- DEBUG STEP: Print OIDC Claims ---
      - name: Debug OIDC Token Claims
        run: |
          # Request the raw JWT token from GitHub's internal token service
          TOKEN=$(curl -sLS -H "User-Agent: actions/bash" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "::error::GitHub failed to issue an ID token! Ensure 'permissions: id-token: write' is set."
            exit 1
          fi

          echo "=== Decoded OIDC Token Payload ==="
          # Decode the middle (payload) part of the JWT
          echo "$TOKEN" | cut -d'.' -f2 | base64 --decode | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=tk/tf-coaching17-infra-${{ github.event.inputs.environment }}.tfstate" \
            -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="envs/${{ github.event.inputs.environment }}.tfvars"